name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - name: Build versioned distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/build_release.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS
          --verify-tag --title "$RELEASE_TAG · 扫描书籍同版重建"
          --notes-file docs/release-notes.md
